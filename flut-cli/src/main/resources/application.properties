# stdout carries only the specification output: no banner, no startup info, logs on stderr (logback-spring.xml).
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN

# Input limits (see InputLimits)
flut.limits.max-schuurs-per-scenario=1000
flut.limits.max-boxes-per-schuur=10000
