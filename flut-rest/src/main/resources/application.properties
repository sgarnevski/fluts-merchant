spring.application.name=flut-rest
server.port=8080

# Uploads (.txt / .json files); JSON bodies are limited by flut.limits.max-body-size
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Input limits (see InputLimits)
flut.limits.max-schuurs-per-scenario=1000
flut.limits.max-boxes-per-schuur=10000
flut.limits.max-body-size=1MB

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.writer-with-order-by-keys=true

# Rules of the trade (see TradingRules); the defaults are the specification's
flut.trading.selling-price=10
flut.trading.max-reported-counts=10
